# SMOKE, teacher ON. NOT run-7. See runs/run7-full-corpus/README.md.
#
# Purpose: prove the teacher term is LIVE during training, not merely wired.
# `train.py:470-483` attaches `ex.teacher` by INDEX into `train_examples`
# (`ex = train_examples[d["i"]]`), so `train_files` below MUST be the six files
# in run-7's order. A subset would move every index and the test would measure
# the wrong rows -- which is exactly the defect the six-file requirement exists
# to prevent.
#
# DELIBERATE DEVIATIONS FROM runs/run7/config-run7.yaml, and why each:
#   max_steps 3                the point is the teacher term, not throughput
#   micro_batch_size 1         laptop VRAM (16 GiB, 2 GiB held by a peer)
#   grad_accum 1               ditto
#   gradient_checkpointing true  smoke VRAM; run-7 has it false (speed only)
#   kl_frozen_weight 0         ISOLATE the teacher; frozen term is a 2nd KL
#   precompute_frozen_kl false it would need a full-corpus forward pass
#   log_every 1                every step's loss IS the measurement
#   eval_every 100000          skip evaluation
# Everything else carries run-7's value verbatim.
train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl",
              "data/generated_v16p.jsonl", "data/generated_v18p.jsonl",
              "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "base"      # overridden by --base-model on the command line
num_slots: 24
head_type: "pointer"
pointer_dim: 256
head_init: "random"

kl_frozen_weight: 0.0
teacher_file: "teacher/teacher_v20.jsonl"
teacher_weight: 1.0     # ARM A. Arm B differs only here and in output_dir.
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj",
               "down_proj"]
freeze_torso: false

epochs: 1
micro_batch_size: 1
grad_accum: 1
lr: 0.0001
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true

shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "out/teacher-on"
seed: 5
log_every: 1
eval_every: 100000
max_steps: 3
precompute_frozen_kl: false
