[mypy]
ignore_missing_imports = False
# The type checkers cover this repository's own code, nothing else. Excluded BY NAME: the read-only
# input trees and the certified environment. Each is named because imports inside it are
# unresolvable by construction, which is a property of the exhibit, not a defect of ours.
# Our live code (`bitsone/`, `checks/`) stays IN scope: nothing here is a byte-for-byte copy of another
# repository any more, so there is no pinned file whose type errors would have to be preserved.
# NOTE: no `(?x)` flag -- in verbose mode the spaces in `System One Models` are ignored, so the pattern
# silently walked the read-only trees (it surfaced as a "Duplicate module named conftest" error from
# GLiNER2).
exclude = ^(System One Models|BitNet Models|Training Data|\.venv-s1)/

# CI runs the type check in an environment with NO torch, transformers or peft (the repo's own rule:
# "no weights, no torch, no GPU"). Without this, every `import torch` is a missing-stub error and the
# job is red for a reason that is not a defect. Locally these packages ARE installed, so the real
# annotations are used; only their absence is tolerated.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-peft.*]
ignore_missing_imports = True

[mypy-safetensors.*]
ignore_missing_imports = True
